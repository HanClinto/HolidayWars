<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holiday Wars - Multiplayer Prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      color: #aaaaaa;
      margin-bottom: 2rem;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    canvas {
      border: 3px solid #4a4a5e;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    #lobby {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      text-align: center;
      min-width: 300px;
    }

    #lobby h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    #hostBtn {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      color: white;
    }

    #joinBtn {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
    }

    #soloBtn {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1rem 0;
      color: #888;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #4a4a5e;
    }

    .divider span {
      padding: 0 1rem;
    }

    .join-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .join-section label {
      text-align: left;
      font-size: 0.9rem;
      color: #aaa;
    }

    input {
      padding: 0.8rem 1rem;
      font-size: 1.2rem;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    input:focus {
      outline: none;
      border-color: #e74c3c;
    }

    input::placeholder {
      letter-spacing: normal;
      text-transform: none;
    }

    #status {
      margin-top: 1rem;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 2rem;
      white-space: pre-line;
    }

    #game {
      display: none;
    }

    .game-info {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .controls-help {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
      text-align: left;
    }

    .controls-help h4 {
      margin-bottom: 0.3rem;
      color: #fff;
    }

    .controls-help ul {
      list-style: none;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>🎄 Holiday Wars 🎄</h1>
  <p class="subtitle">Multiplayer Prototype</p>

  <div id="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="lobby">
      <h2>Start a Match</h2>

      <div class="button-group">
        <button id="hostBtn">🏠 Host Match (Team A)</button>
        <button id="soloBtn">🎮 Solo Practice</button>
      </div>

      <div class="divider"><span>or join an existing match</span></div>

      <div class="join-section">
        <label for="roomCode">Enter Room Code:</label>
        <input type="text" id="roomCode" placeholder="XXXX" maxlength="4">
        <button id="joinBtn">🚀 Join Match (Team B)</button>
      </div>

      <div id="status"></div>
    </div>

    <div id="game">
      <div class="game-info">
        Press <strong>any button</strong> on a controller or <strong>WASD/Arrow keys</strong> to join!
      </div>

      <div class="controls-help">
        <div>
          <h4>⌨️ Keyboard</h4>
          <ul>
            <li>WASD or Arrow Keys to move</li>
          </ul>
        </div>
        <div>
          <h4>🎮 Gamepad</h4>
          <ul>
            <li>Left Stick or D-Pad to move</li>
            <li>Press any button to join</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
